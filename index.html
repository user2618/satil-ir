
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="دامنه ارزشمند SATIL.IR برای فروش است. جهت خرید با ما در تلگرام در ارتباط باشید.">
  <title>SATIL.IR | دامنه برای فروش</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Tahoma, Arial, sans-serif;
      color: #fff;
      background:
        radial-gradient(ellipse at 50% 20%, #263b60 0%, transparent 55%),
        linear-gradient(145deg, #080e1b, #101b30 65%, #080e1b);
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 650px;
      text-align: center;
      padding: 65px 25px;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 24px;
      background: rgba(255,255,255,.045);
      box-shadow: 0 25px 80px rgba(0,0,0,.35);
    }

    .domain {
      direction: ltr;
      font-size: clamp(48px, 10vw, 82px);
      font-weight: 800;
      letter-spacing: 3px;
      color: #65d6df;
      margin-bottom: 25px;
      text-shadow: 0 0 35px rgba(101,214,223,.2);
    }

    h1 {
      font-size: 25px;
      margin-bottom: 18px;
    }

    p {
      color: #b9c5d7;
      line-height: 2.2;
      font-size: 15px;
    }

    .button {
      display: inline-block;
      margin-top: 28px;
      padding: 15px 32px;
      border-radius: 12px;
      background: #229ED9;
      color: white;
      text-decoration: none;
      font-weight: bold;
      font-size: 16px;
      transition: .25s;
    }

    .button:hover {
      background: #1688bd;
      transform: translateY(-3px);
    }

    .telegram {
      direction: ltr;
      display: block;
      margin-top: 22px;
      color: #65d6df;
      text-decoration: none;
      font-size: 14px;
    }

    footer {
      margin-top: 55px;
      color: #718096;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <main class="container">
    <div class="domain">SATIL.IR</div>

    <h1>این دامنه برای فروش است</h1>

    <p>
      جهت اطلاع از قیمت و شرایط خرید دامنه
      <br>
      از طریق تلگرام با ما در ارتباط باشید.
    </p>

    <a class="button"
       href="https://t.me/DomainAd"
       target="_blank"
       rel="noopener noreferrer">
      ارتباط با ما در تلگرام
    </a>

    <a class="telegram" href="https://t.me/DomainAd">
      @DomainAd
    </a>

    <footer>
      SATIL.IR &copy; All Rights Reserved
    </footer>
  </main>
</body>
</html>
